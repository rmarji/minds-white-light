<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5-MeO-DMT · a journey through the brain</title>
<meta name="theme-color" content="#000000">
<style>
  :root { --ink: #fff; --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
          --sans: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html { background: #000; }
  body { margin: 0; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased;
         overscroll-behavior: none; }
  #spacer { height: 800vh; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y;
              cursor: grab; outline: none; }
  canvas#gl:active { cursor: grabbing; }
  /* UI inverts itself over the white-out */
  #ui { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: difference; z-index: 2;
        padding: max(18px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                 max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  #title { position: absolute; top: max(18px, env(safe-area-inset-top));
           left: max(20px, env(safe-area-inset-left)); }
  #title b { display: block; font-weight: 500; letter-spacing: .28em; text-transform: uppercase; font-size: 11px; }
  #title i { display: block; margin-top: 6px; font: italic 13px var(--serif); opacity: .6; }
  #stage { position: absolute; left: max(20px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom));
           max-width: min(430px, 76vw); transition: opacity .5s ease, transform .5s ease; }
  #stage.swap { opacity: 0; transform: translateY(8px); }
  #stage .num { font-size: 11px; letter-spacing: .3em; opacity: .65; }
  #stage h1 { margin: 6px 0 8px; font: 400 clamp(34px, 7vw, 60px)/1 var(--serif); letter-spacing: -.01em; }
  #stage p { margin: 0; font: italic clamp(14px, 2.1vw, 17px)/1.5 var(--serif); opacity: .82; }
  #rail { position: absolute; right: max(18px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
          height: min(46vh, 320px); width: 28px; pointer-events: auto; }
  #rail .track, #rail .fill { position: absolute; left: 13px; width: 1px; top: 0; }
  #rail .track { height: 100%; background: rgba(255,255,255,.22); }
  #rail .fill { height: 0; background: #fff; }
  #rail button { position: absolute; left: 3px; width: 22px; height: 22px; margin-top: -11px; padding: 0; border: 0;
                 background: none; cursor: pointer; }
  #rail button::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1px solid #fff;
                        background: #000; transition: transform .3s, background .3s; }
  #rail button.on::after { background: #fff; transform: scale(1.35); }
  #rail button span { position: absolute; right: 30px; top: 3px; white-space: nowrap; font-size: 10px;
                      letter-spacing: .22em; text-transform: uppercase; color: #fff; opacity: 0; transition: opacity .3s; }
  #rail button:hover span, #rail button.on span { opacity: .7; }
  #play { position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
          pointer-events: auto; cursor: pointer; background: none; color: #fff; border: 1px solid rgba(255,255,255,.45);
          border-radius: 999px; padding: 8px 14px; font: 500 10px var(--sans); letter-spacing: .24em;
          text-transform: uppercase; }
  #play:hover { background: #fff; color: #000; }
  #hint { position: absolute; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); text-align: center;
          font-size: 10px; letter-spacing: .26em; text-transform: uppercase; opacity: .55; transition: opacity 1s; }
  #hint.off { opacity: 0; }
  @media (max-width: 720px) { #hint { bottom: auto; top: 64px; font-size: 9px; } #rail button span { display: none; } }
  #caption { position: fixed; z-index: 3; right: max(64px, env(safe-area-inset-right)); bottom: max(30px, env(safe-area-inset-bottom));
             width: min(380px, 36vw); transform: translateY(10px); text-align: right; pointer-events: none; opacity: 0;
             transition: opacity .6s ease, transform .6s ease; mix-blend-mode: difference; color: #fff; }
  #caption.show { opacity: 1; transform: none; }
  @media (max-width: 720px) {
    #caption { right: 0; left: 0; bottom: auto; top: 84px; width: auto; padding: 0 24px; text-align: center; }
  }
  #caption small { display: block; font-size: 10px; letter-spacing: .3em; text-transform: uppercase; opacity: .7; }
  #caption q { display: block; quotes: none; margin-top: 10px; font: italic clamp(19px, 3.4vw, 26px)/1.35 var(--serif); }
  #loading { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: #000;
             font: italic 15px var(--serif); color: #aaa; transition: opacity 1.2s; text-align: center; padding: 24px; }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="A brain made of glowing threads"></canvas>
<div id="spacer"></div>

<div id="ui">
  <div id="title"><b>5-MeO-DMT · the brain</b><i>an artistic rendering, not a medical claim</i></div>
  <button id="play" type="button">▶ Play</button>
  <div id="stage"><div class="num"></div><h1></h1><p></p></div>
  <div id="rail"><div class="track"></div><div class="fill"></div></div>
  <div id="hint">scroll to journey · drag to turn · tap the brain</div>
</div>
<div id="caption"><small></small><q></q></div>
<div id="loading">gathering threads…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- timeline
// Same score as scene.py: every quantity is a pure function of time (seconds).
const DUR = 13;
const STAGES = [
  { at: 0.0, rest: 1.6, name: 'Sparks', text: 'It begins as a flicker. Scattered signals race along the threads, each one a small yes.' },
  { at: 2.6, rest: 5.3, name: 'Spread', text: 'The cascade climbs from the stem and floods every pathway. The default-mode network, keeper of the story of “me”, falls quiet.' },
  { at: 5.7, rest: 8.7, name: 'Dissolve', text: 'Boundaries let go. The threads unravel and melt into a single field of white light. No inside, no outside.' },
  { at: 9.3, rest: 13.0, name: 'Return', text: 'The light condenses, gently, back into a brain: calm, whole, and remembering that it was everything.' },
];
const ss = (a, b, t) => { const x = Math.min(1, Math.max(0, (t - a) / (b - a))); return x * x * (3 - 2 * x); };
function timeline(t) {
  const D = ss(5.6, 8.2, t) - ss(9.0, 11.6, t), calm = ss(9.2, 12.0, t);
  return {
    SPARK: 0.035 + 0.10 * ss(0.3, 3.0, t) + 0.2 * calm,
    FRONT: -0.25 + 1.45 * ss(2.4, 5.4, t),
    PSY: ss(2.6, 4.8, t) * (1 - calm),
    DMN: ss(3.2, 5.2, t) - ss(10.4, 12.4, t),
    D, CALM: calm,
    WHITE: ss(6.6, 8.3, t) - ss(9.0, 11.0, t),
    BASE: 0.38 + 0.17 * ss(2.5, 5.0, t) - 0.10 * calm,
    PULSE: (5.0 - 2.2 * ss(2.5, 5.0, t)) * (1 - 0.55 * calm),
    GLOW: ss(6.2, 8.3, t) - ss(9.0, 11.4, t),
    FLAT: ss(7.5, 8.5, t) - ss(8.9, 10.2, t),
  };
}

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
const CENTER = new THREE.Vector3(0, -0.06, 0);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(4.6, 0.9, 3.2);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(CENTER);
controls.enableZoom = false;          // the wheel belongs to the journey
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.75;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.ROTATE };
canvas.style.touchAction = 'pan-y';   // vertical swipes scroll the page, horizontal drags turn the brain
let idleTimer = 0;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); dismissHint(); });
controls.addEventListener('end', () => { idleTimer = setTimeout(() => (controls.autoRotate = true), 7000); });

const U = {   // shared uniforms
  uT: { value: 0 }, uD: { value: 0 }, uSpark: { value: 0 }, uFront: { value: 0 }, uPsy: { value: 0 },
  uDmn: { value: 0 }, uWhite: { value: 0 }, uCalm: { value: 0 }, uBase: { value: 0 }, uPulse: { value: 0 },
  uGlow: { value: 0 }, uFlat: { value: 0 }, uAspect: { value: 1 }, uPx: { value: 1 },
  uHi: { value: new THREE.Vector3() }, uHiR: { value: 0.3 }, uHiAmt: { value: 0 },
};

// ---------------------------------------------------------------- shaders
const COMMON = /* glsl */`
  uniform float uT, uD, uSpark, uFront, uPsy, uDmn, uWhite, uCalm, uBase, uPulse, uHiR, uHiAmt, uPx;
  uniform vec3 uHi;
  float sstep(float x) { x = clamp(x, 0., 1.); return x * x * x * (x * (x * 6. - 15.) + 10.); }
  vec3 hsv(float h, float s, float v) {
    vec3 p = abs(fract(vec3(h) + vec3(0., 2. / 3., 1. / 3.)) * 6. - 3.);
    return v * mix(vec3(1.), clamp(p - 1., 0., 1.), s);
  }
  vec3 ramp3(float x, vec3 a, vec3 b, vec3 c, float mid) {
    return x < mid ? mix(a, b, x / mid) : mix(b, c, (x - mid) / (1. - mid));
  }
`;
const VERT_MORPH = /* glsl */`
  attribute vec3 _target;   // dissolved position (Blender Z-up)
  attribute vec3 _data;     // u along thread, thread seed, cascade delay
  attribute vec3 _data2;    // default-mode weight, dissolve delay, gain
  varying float vU, vSeed, vAct, vDmn, vGain, vM;
  varying vec3 vP;
  vec3 morphed() {
    vU = _data.x; vSeed = _data.y; vAct = _data.z; vDmn = _data2.x; vGain = _data2.z;
    float m = sstep(uD * 2. - _data2.y);
    vec3 tgt = vec3(_target.x, _target.z, -_target.y);
    vec3 p = mix(position, tgt, m);
    vec3 q = position * 1.6 + vSeed;
    vec3 n = vec3(sin(q.y * 2.3 + q.z * 1.7 + uT * .50), sin(q.z * 2.1 + q.x * 1.9 + uT * .42), sin(q.x * 2.5 + q.y * 1.3 + uT * .46));
    p += n * (m * (1. - m) * 4. * .24 + m * .035);
    vM = m; vP = position;
    return p;
  }
`;
const SHADE = /* glsl */`
  varying float vU, vSeed, vAct, vDmn, vGain, vM;
  varying vec3 vP;
  // returns colour; 'head' receives the brightness of the travelling pulse head
  vec3 shade(float u, float seed, float act, float dmn, float gain, float m, vec3 P, out float head) {
    float seed2 = fract(seed * 91.7);
    float isSpark = step(seed2, uSpark);
    float inFront = clamp((uFront - act) / .12, 0., 1.);
    float activity = max(isSpark, inFront);
    float phase = fract(u * 1.4 - uT * (.30 + seed2 * .55) + seed * 13.1);
    float flick = pow(.5 + .5 * sin(uT * (2.5 + seed2 * 5.) + seed * 50.), 2.);
    flick = mix(flick, 1., inFront);
    float pulse = pow(phase, 7.) * activity * flick + inFront * (1. - inFront) * .9;
    float quiet = 1. - dmn * uDmn * .94;
    float breath = mix(1., .7 + .3 * sin(uT * 2.4 - act * 5.), uCalm);
    vec3 calmCol = ramp3(seed2, vec3(1., .45, .12), vec3(1., .72, .36), vec3(.45, .8, 1.), .55);
    vec3 baseCol = mix(ramp3(seed2, vec3(.03, .05, .55), vec3(.38, .06, .75), vec3(0., .42, .6), .5), calmCol, uCalm);
    float hue = mix(.07 + seed2 * .07, fract(seed * .22 + act * 1.6 - uT * .12), uPsy);
    vec3 pulseCol = mix(hsv(hue, .55 + .37 * uPsy, 1.), calmCol, uCalm * .8);
    vec3 col = baseCol * (uBase * gain * quiet * breath) + pulseCol * (uPulse * pulse * quiet);
    col = mix(col, vec3(1., .97, .92) * (2.5 + 5. * uWhite), max(uWhite, m));
    float hi = uHiAmt * smoothstep(uHiR, uHiR * .25, distance(P, uHi)) * (1. - m);
    col += (vec3(1., .78, .5) * .5 + col * 1.2) * hi;
    head = pow(phase, 40.) * activity * flick * quiet * (1. - max(uWhite, m)) + hi * .15 * step(.93, fract(seed2 * 7. + u * 3.));
    return col;
  }
`;

const lineMat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: COMMON + VERT_MORPH + `void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(morphed(), 1.); }`,
  fragmentShader: COMMON + SHADE + `void main() { float h; vec3 c = shade(vU, vSeed, vAct, vDmn, vGain, vM, vP, h);
    gl_FragColor = vec4(c * .10 * min(uPx, 2.), 1.); }`,
});
// bright heads of the pulses, drawn as soft points over the lines
const headMat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: COMMON + VERT_MORPH + SHADE.replace(/varying[^;]+;/g, '') + /* glsl */`
    varying vec3 vCol;
    void main() {
      vec3 p = morphed(); float h;
      vec3 c = shade(vU, vSeed, vAct, vDmn, vGain, vM, vP, h);
      vCol = c * h * .55;
      gl_Position = h < .03 ? vec4(2., 2., 2., 1.) : projectionMatrix * modelViewMatrix * vec4(p, 1.);
      gl_PointSize = uPx * (2. + 5. * h);
    }`,
  fragmentShader: /* glsl */`varying vec3 vCol; void main() { float d = length(gl_PointCoord - .5);
    gl_FragColor = vec4(vCol * smoothstep(.5, .0, d), 1.); }`,
});

// the void, and the light that fills it
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: U, depthTest: false, depthWrite: false,
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader: /* glsl */`
    uniform float uGlow, uFlat, uAspect; varying vec2 vUv;
    void main() {
      vec2 p = (vUv - .5) * vec2(uAspect, 1.); if (uAspect < 1.) p /= uAspect;
      float d = length(p);
      vec3 c = vec3(.012, .008, .034) * max(0., 1. - d * 1.1);
      float core = pow(clamp(1. - d / (uGlow * 1.5 + .05), 0., 1.), 2.);
      c += vec3(1., .96, .90) * (core * uGlow * 1.6 + uFlat * 9.);
      gl_FragColor = vec4(c, 1.);
    }`,
}));
bg.frustumCulled = false; bg.renderOrder = -10;
scene.add(bg);

// dust, so the dark has depth
{
  const n = 1500, pos = new Float32Array(n * 3), sd = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(1.4 + Math.random() * 3.6).add(CENTER);
    v.toArray(pos, i * 3); sd[i] = Math.random();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('seed', new THREE.BufferAttribute(sd, 1));
  const dust = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`uniform float uT, uPx, uD; attribute float seed; varying float vA;
      void main() { vec3 p = position * (1. + uD * .35 * seed);
        vA = .35 + .65 * pow(.5 + .5 * sin(uT * (.6 + seed * 2.) + seed * 40.), 2.);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.); gl_PointSize = uPx * (1. + seed * 1.6); }`,
    fragmentShader: /* glsl */`varying float vA; void main() { float d = length(gl_PointCoord - .5);
      gl_FragColor = vec4(vec3(.5, .55, 1.) * vA * .55 * smoothstep(.5, .1, d), 1.); }`,
  }));
  dust.frustumCulled = false;
  scene.add(dust);
}

// ---------------------------------------------------------------- post
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.5, 0.6, 0.3);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  U.uAspect.value = w / h;
  U.uPx.value = renderer.getPixelRatio() * Math.max(1, Math.min(w, h) / 700);
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- the brain
const regions = [];
const RETURN_LINES = {
  prefrontal: 'The narrator picks the pen back up, and writes more gently now.',
  precuneus: 'The lantern of “me” relights, but the window stays open.',
  thalamus: 'The gate settles. What came through stays with you.',
  brainstem: 'Still breathing. You never had to hold it together.',
};
let ready = false;
new GLTFLoader().load('scene.glb', (gltf) => {
  gltf.scene.updateMatrixWorld(true);
  let threads = null;
  gltf.scene.traverse((o) => {
    if (o.isLine && o.geometry.getAttribute('_target')) threads = o;
    if (o.name.startsWith('region_')) {
      regions.push({ key: o.name.slice(7), pos: o.getWorldPosition(new THREE.Vector3()),
                     radius: o.userData.radius || 0.3, title: o.userData.title, caption: o.userData.caption });
    }
  });
  if (!threads) return fail('scene.glb loaded, but the thread mesh is missing.');
  const lines = new THREE.LineSegments(threads.geometry, lineMat);
  const heads = new THREE.Points(threads.geometry, headMat);
  lines.frustumCulled = heads.frustumCulled = false;
  scene.add(lines, heads);
  addMarkers();
  ready = true;
  document.getElementById('loading').classList.add('done');
}, undefined, () => fail('Could not load scene.glb. Serve this folder over http (e.g. <code>python3 -m http.server</code>) and reload.'));
function fail(msg) { document.getElementById('loading').innerHTML = msg; }

// faint rings marking the places you can touch
function addMarkers() {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(regions.flatMap((r) => r.pos.toArray())), 3));
  g.setAttribute('seed', new THREE.BufferAttribute(new Float32Array(regions.map((_, i) => i / regions.length)), 1));
  const m = new THREE.Points(g, new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthTest: false, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`uniform float uT, uPx, uD; attribute float seed; varying float vA;
      void main() { vA = (.55 + .45 * sin(uT * 1.6 + seed * 6.283)) * (1. - smoothstep(.05, .4, uD));
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); gl_PointSize = uPx * 22.; }`,
    fragmentShader: /* glsl */`varying float vA; void main() { float d = length(gl_PointCoord - .5) * 2.;
      float ring = smoothstep(.12, .0, abs(d - .72)) * .5 + smoothstep(.22, .0, d);
      gl_FragColor = vec4(vec3(1., .9, .75) * ring * vA * .5, 1.); }`,
  }));
  m.frustumCulled = false;
  scene.add(m);
}

// ---------------------------------------------------------------- tap for captions
const captionEl = document.getElementById('caption');
let captionTimer = 0, down = null;
function showCaption(title, text) {
  captionEl.querySelector('small').textContent = title;
  captionEl.querySelector('q').textContent = text;
  captionEl.classList.add('show');
  clearTimeout(captionTimer);
  captionTimer = setTimeout(() => captionEl.classList.remove('show'), 6500);
}
const ray = new THREE.Raycaster(), sphere = new THREE.Sphere(), hit = new THREE.Vector3();
function pick(x, y) {
  if (!ready) return;
  dismissHint();
  const tl = timeline(time);
  if (tl.D > 0.55) return showCaption('Everywhere', 'No regions here. No here. Only light.');
  ray.setFromCamera(new THREE.Vector2((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1), camera);
  let best = null, bestD = Infinity;
  for (const r of regions) {
    sphere.set(r.pos, r.radius * 1.15);
    if (ray.ray.intersectSphere(sphere, hit)) {
      const d = hit.distanceTo(camera.position);
      if (d < bestD) { bestD = d; best = r; }
    }
  }
  if (!best) return captionEl.classList.remove('show');
  U.uHi.value.copy(best.pos); U.uHiR.value = best.radius * 1.5; hiTarget = 1;
  setTimeout(() => (hiTarget = 0), 4500);
  showCaption(best.title, (tl.CALM > 0.5 && RETURN_LINES[best.key]) || best.caption);
}
let hiTarget = 0;
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', (e) => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 8 && performance.now() - down.t < 600) pick(e.clientX, e.clientY);
  down = null;
});

// ---------------------------------------------------------------- scroll = time
const params = new URLSearchParams(location.search);
let target = 0, time = 0, playing = null;
const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
const readScroll = () => { target = (window.scrollY / maxScroll()) * DUR; };
window.addEventListener('scroll', () => { readScroll(); if (window.scrollY > 40) dismissHint(); }, { passive: true });
const goTo = (t, smooth = true) => window.scrollTo({ top: (t / DUR) * maxScroll(), behavior: smooth ? 'smooth' : 'auto' });
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
if (params.has('t')) { requestAnimationFrame(() => { goTo(+params.get('t'), false); readScroll(); time = target; }); }

const hintEl = document.getElementById('hint');
function dismissHint() { hintEl.classList.add('off'); }

const rail = document.getElementById('rail'), fill = rail.querySelector('.fill'), dots = [];
STAGES.forEach((s, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.style.top = (s.rest / DUR) * 100 + '%';
  b.setAttribute('aria-label', s.name);
  b.innerHTML = `<span>${s.name}</span>`;
  b.addEventListener('click', () => { stopPlay(); goTo(s.rest); });
  rail.appendChild(b); dots.push(b);
});
const stageEl = document.getElementById('stage');
let stageIdx = -1;
function setStage(i) {
  if (i === stageIdx) return;
  stageIdx = i;
  stageEl.classList.add('swap');
  setTimeout(() => {
    stageEl.querySelector('.num').textContent = `0${i + 1} / 04`;
    stageEl.querySelector('h1').textContent = STAGES[i].name;
    stageEl.querySelector('p').textContent = STAGES[i].text;
    stageEl.classList.remove('swap');
  }, 380);
  dots.forEach((d, k) => d.classList.toggle('on', k === i));
}

const playBtn = document.getElementById('play');
function stopPlay() { playing = null; playBtn.textContent = '▶ Play'; }
playBtn.addEventListener('click', () => {
  if (playing) return stopPlay();
  dismissHint();
  if (target > DUR - 0.3) goTo(0, false);
  playing = { from: target > DUR - 0.3 ? 0 : target, start: performance.now() };
  playBtn.textContent = '❚❚ Pause';
});
['wheel', 'touchstart', 'keydown'].forEach((ev) => window.addEventListener(ev, () => playing && stopPlay(), { passive: true }));

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (playing) {
    const t = playing.from + (performance.now() - playing.start) / 1000 / 1.35;
    if (t >= DUR) { goTo(DUR, false); stopPlay(); } else goTo(t, false);
  }
  time += (target - time) * (1 - Math.exp(-dt * 6));
  const tl = timeline(time);
  U.uT.value += dt;
  U.uD.value = tl.D; U.uSpark.value = tl.SPARK; U.uFront.value = tl.FRONT; U.uPsy.value = tl.PSY;
  U.uDmn.value = tl.DMN; U.uWhite.value = tl.WHITE; U.uCalm.value = tl.CALM; U.uBase.value = tl.BASE;
  U.uPulse.value = tl.PULSE; U.uGlow.value = tl.GLOW; U.uFlat.value = tl.FLAT;
  U.uHiAmt.value += (hiTarget - U.uHiAmt.value) * (1 - Math.exp(-dt * 4));

  // frame the brain for any aspect ratio, and lean in as it dissolves
  const half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max(1.12 / half, 1.28 / (half * camera.aspect)) * (1 - 0.16 * tl.D);
  controls.update();
  tmp.copy(camera.position).sub(CENTER).setLength(dist);
  camera.position.copy(CENTER).add(tmp);
  camera.lookAt(CENTER);

  bloom.strength = 0.5 + 0.5 * tl.WHITE;
  let s = 0; for (let i = 0; i < STAGES.length; i++) if (time >= STAGES[i].at - 0.05) s = i;
  setStage(s);
  fill.style.height = (time / DUR) * 100 + '%';
  composer.render();
}
readScroll();
frame();
window.__state = () => ({ ready, time, regions: regions.length });
</script>
